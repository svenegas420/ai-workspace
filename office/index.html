<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/workspace.css">
<script defer src="/workspace-ui.js"></script>
<link rel="stylesheet" href="/portal.css">
<script defer src="/portal-ui.js"></script>
<title>Oficina de Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Optional libraries: without internet the page still works (no animations/icons/logos) -->
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #111219; --bg2: #191b26; --panel: #1d202b; --panel2: #262a37; --ink: #eceae4; --muted: #9295a6; --faint: #6b6e80; --line: #2e3242;
    --working: #4fd18b; --waiting: #f2b33d; --idle: #7ea6f6; --sleeping: #6f7387; --gold: #f5c542;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.35);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3efe7; --bg2: #ebe5d9; --panel: #fffdf9; --panel2: #f3eee5; --ink: #24211c; --muted: #6c665b; --faint: #9a9385; --line: #e2d9c9;
      --shadow: 0 1px 2px rgba(60,40,10,.06), 0 10px 26px rgba(60,40,10,.08);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(1100px 520px at 0% -10%, var(--bg2), var(--bg) 70%);
         font: 14px/1.45 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .icon { width: 15px; height: 15px; vertical-align: -2px; stroke-width: 2.2; flex: none; }
  .pixel { font-family: "Pixelify Sans", Inter, sans-serif; }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 24px;
           background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 700 22px/1 "Pixelify Sans", Inter, sans-serif; display: flex; align-items: center; gap: 10px; }
  h1 .logo { width: 30px; height: 30px; border: 0; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #e2805a, #39c494); color: #fff; cursor: pointer; padding: 0; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 700; }
  button.chip { cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s); flex: none; }
  .dot.live { box-shadow: 0 0 0 0 var(--s); animation: ping 1.6s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s) 70%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  .controls { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: 500 12px Inter, sans-serif; padding: 5px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); }

  /* ---------- usage ---------- */
  .usage { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); padding: 18px 24px 0; }
  .ucard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 12px; align-content: start; }
  .uhead { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); color: var(--c); flex: none; }
  .uhead b { font-size: 15px; } .uhead small { display: block; color: var(--muted); font-size: 11px; }
  .uhead .right { margin-left: auto; text-align: right; color: var(--faint); font-size: 11px; }
  .meters { display: grid; gap: 10px; }
  .meter .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .meter .row b { color: var(--ink); font: 700 15px "Pixelify Sans", Inter, sans-serif; }
  .bar { height: 10px; border-radius: 99px; background: var(--panel2); overflow: hidden; position: relative; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--g); width: var(--w); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .kvs { display: flex; gap: 8px; }
  .kv { flex: 1; background: var(--panel2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kv b { display: block; font: 700 16px/1.1 "Pixelify Sans", Inter, sans-serif; }
  .kv span { font-size: 11px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 10px; padding: 9px 11px; }
  .hint code { font-family: var(--mono); color: var(--ink); }

  /* ---------- team ---------- */
  main { padding: 20px 24px 56px; display: grid; gap: 22px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin: 0 2px; font: 700 17px "Pixelify Sans", Inter, sans-serif; }
  .section-head small { font: 500 12px Inter, sans-serif; color: var(--faint); }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }

  /* ---------- agent card ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .3s, box-shadow .3s; box-shadow: var(--shadow); }
  .card.working { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); box-shadow: 0 0 0 3px var(--soft), var(--shadow); }
  .card.waiting { border-color: var(--waiting); box-shadow: 0 0 0 3px rgba(242,179,61,.18), var(--shadow); }
  .card.sleeping { opacity: .8; }
  body.god .card { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,197,66,.35), 0 0 30px rgba(245,197,66,.25); }
  .scene { position: relative; aspect-ratio: 96 / 64; background: #2a2540; }
  .scene canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .pill { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
          background: rgba(12,12,20,.74); color: #fff; font: 600 12px Inter, sans-serif; backdrop-filter: blur(4px); pointer-events: none; max-width: 60%; }
  .pill.vend { left: 8px; top: 8px; padding-left: 4px; }
  .pill.vend .av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #111; flex: none; }
  .pill.vend .av .icon { width: 12px; height: 12px; }
  .pill.state { right: 8px; top: 8px; font-size: 11px; }
  .proj { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px; max-width: 58%; padding: 3px 9px 3px 7px; border-radius: 6px;
          background: #2b1f17; border: 2px solid #8a5a3a; box-shadow: 0 2px 0 #1a120d; color: #f6e7cf; font: 700 13px/1.1 "Pixelify Sans", Inter, sans-serif; pointer-events: none; }
  .proj i { width: 8px; height: 8px; border-radius: 2px; background: var(--p); flex: none; }
  .proj span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .langs { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; pointer-events: auto; }
  .lang { width: 24px; height: 24px; border-radius: 7px; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .lang img { width: 17px; height: 17px; display: block; }
  .lang.txt { width: auto; padding: 0 6px; font: 700 10px var(--mono); color: #222; }
  .body { padding: 12px 14px 14px; display: grid; gap: 9px; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 11px; }
  .activity { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--c); font: 600 11px Inter, sans-serif; }
  .activity .icon { width: 12px; height: 12px; }
  .ttl { font-weight: 600; font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ttl.none { color: var(--faint); font-weight: 500; }
  .said { margin: 0; font-size: 13px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--c);
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .act { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 9px; padding: 6px 9px; min-width: 0; }
  .act .icon { color: var(--c); }
  .act code { font: 12px var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .act .tool { font: 600 11px Inter, sans-serif; color: var(--muted); flex: none; }
  .subs { display: grid; gap: 4px; border-top: 1px dashed var(--line); padding-top: 9px; }
  .subs .lbl { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .sub { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
  .sub span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

  /* ---------- plan boards ---------- */
  .boards { display: grid; gap: 16px; }
  .plan { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; box-shadow: var(--shadow); }
  .plan-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
  .plan-head b { font: 700 15px "Pixelify Sans", Inter, sans-serif; }
  .plan-head .proj-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--p); }
  .plan-head .pbar { flex: 1; min-width: 80px; max-width: 220px; height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .plan-head .pbar span { display: block; height: 100%; background: var(--working); width: var(--w); }
  .plan-head small { color: var(--muted); }
  .lanes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
  .lane { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .lane h4 { margin: 0 0 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--c); }
  .lane h4 small { color: var(--faint); font-weight: 500; margin-left: auto; }
  .task { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 5px 4px; border-radius: 6px; }
  .task .icon { margin-top: 1px; color: var(--faint); }
  .task.doing { background: var(--soft); } .task.doing .icon { color: var(--c); }
  .task.blocked .icon { color: #ef6b5b; }
  .task.done { color: var(--faint); text-decoration: line-through; } .task.done .icon { color: var(--working); }
  .task .n { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-top: 1px; }

  .empty { text-align: center; color: var(--muted); padding: 70px 20px; border: 2px dashed var(--line); border-radius: 20px; grid-column: 1 / -1; }
  .empty code { font-family: var(--mono); background: var(--panel2); padding: 2px 6px; border-radius: 4px; }

  /* ---------- easter eggs ---------- */
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 10px;
           border-radius: 999px; background: #15161d; color: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.5); border: 1px solid #2f3242; max-width: calc(100vw - 32px); }
  .toast .tro { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #f5c542, #e2805a); color: #15161d; flex: none; font-size: 20px; }
  .toast small { display: block; color: #a7aabb; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .toast b { font: 700 16px "Pixelify Sans", Inter, sans-serif; }
  .toast p { margin: 2px 0 0; font-size: 12px; color: #c9cbd6; }
  #secrets { position: fixed; right: 16px; top: 64px; z-index: 40; width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: none; }
  #secrets.open { display: block; }
  #secrets h3 { margin: 0 0 10px; font: 700 16px "Pixelify Sans", Inter, sans-serif; display: flex; align-items: center; gap: 8px; }
  .ach { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-top: 1px solid var(--line); font-size: 13px; }
  .ach .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--panel2); flex: none; font-size: 15px; }
  .ach.got .ico { background: linear-gradient(135deg, #f5c542, #e2805a); }
  .ach small { display: block; color: var(--muted); font-size: 11.5px; }
  .ach.locked b { color: var(--faint); }
  @keyframes roll { to { transform: rotate(360deg); } }
  body.roll main, body.roll .usage { animation: roll 1.3s cubic-bezier(.45,.05,.35,1); }

  @media (max-width: 560px) {
    header, main, .usage { padding-left: 16px; padding-right: 16px; }
    .controls { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>

<script>
/* ======================= helpers ======================= */
const STATUS = { working: 'Trabajando', waiting: 'Esperándote', idle: 'En pausa', sleeping: 'Durmiendo' };
const ACTIVITY = {
  code: ['Programando', 'code-xml'], test: ['Probando', 'flask-conical'], video: ['Editando video', 'clapperboard'],
  write: ['Escribiendo', 'pen-line'], design: ['Diseñando', 'palette'], browse: ['Investigando', 'globe'],
  data: ['Analizando datos', 'chart-column'], think: ['Pensando', 'brain'],
};
const LANG = { // devicon key -> [label, accent colour]
  javascript: ['JavaScript', '#f7df1e'], typescript: ['TypeScript', '#3178c6'], react: ['React', '#61dafb'], python: ['Python', '#ffd43b'],
  jupyter: ['Jupyter', '#f37626'], php: ['PHP', '#8f93d8'], dart: ['Dart', '#40c4ff'], flutter: ['Flutter', '#54c5f8'], java: ['Java', '#f89820'],
  kotlin: ['Kotlin', '#a97bff'], swift: ['Swift', '#fa7343'], go: ['Go', '#00add8'], rust: ['Rust', '#dea584'], ruby: ['Ruby', '#e0115f'],
  csharp: ['C#', '#9b4f96'], cplusplus: ['C++', '#659ad2'], c: ['C', '#a8b9cc'], html5: ['HTML', '#e34f26'], css3: ['CSS', '#3c9be8'],
  sass: ['Sass', '#cc6699'], less: ['Less', '#3d6db5'], vuejs: ['Vue', '#41b883'], svelte: ['Svelte', '#ff3e00'], mysql: ['SQL', '#4479a1'],
  bash: ['Bash', '#4eaa25'], powershell: ['PowerShell', '#5391fe'], lua: ['Lua', '#7f7fff'], r: ['R', '#276dc3'], scala: ['Scala', '#dc322f'],
  elixir: ['Elixir', '#a074c4'], haskell: ['Haskell', '#9e86c8'], zig: ['Zig', '#f7a41d'], godot: ['Godot', '#478cbf'], laravel: ['Laravel', '#ff2d20'],
  astro: ['Astro', '#ff5d01'], nodejs: ['Node.js', '#5fa04e'], docker: ['Docker', '#2496ed'],
};
const DEVICON = 'https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/';
const M = window.Motion || null;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, opt) => { if (M && !REDUCE && el) try { M.animate(el, kf, opt); } catch {} };
const icons = () => { try { window.lucide && lucide.createIcons({ attrs: { class: 'icon' } }); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return `hace ${s}s`; const m = Math.round(s / 60); if (m < 60) return `hace ${m} min`; return `hace ${Math.round(m / 60)} h`; };
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' k' : String(n);
const resetIn = ts => { if (!ts) return ''; const ms = ts - Date.now(); if (ms <= 0) return 'se reinicia ya';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24); return d >= 1 ? `reinicia en ${d} d ${h % 24} h` : `reinicia en ${h} h ${Math.round((ms % 3600000) / 60000)} min`; };
function prettyModel(m) {
  if (!m) return '';
  const c = m.match(/^claude-([a-z]+)-(\d+)(?:-(\d+))?/i);
  if (c) return c[1][0].toUpperCase() + c[1].slice(1) + ' ' + c[2] + (c[3] && c[3].length < 3 ? '.' + c[3] : '');
  return m;
}
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const projColor = p => `hsl(${hash(p) % 360} 70% 62%)`;
function toolInfo(action) {
  if (!action) return null;
  const i = action.indexOf(':');
  const tool = i > 0 ? action.slice(0, i) : action, detail = i > 0 ? action.slice(i + 1).trim() : '';
  const t = tool.toLowerCase();
  const icon = /bash|shell|exec|command|powershell/.test(t) ? 'terminal' : /^read|view/.test(t) ? 'file-text'
    : /edit|write|patch/.test(t) ? 'file-pen-line' : /grep|glob|search|find/.test(t) ? 'search'
    : /web|fetch|navigate|chrome|browser/.test(t) ? 'globe' : /agent|task|workflow/.test(t) ? 'users' : /skill/.test(t) ? 'book-open' : 'wrench';

    for (let i = 0; i < 6; i++) { const y = sy + 3 + i * 2 - (off % 2); if (y < sy + 3 || y > sy + 12) continue; const k = (i + Math.floor(off / 2)) % 4;
      if (k === 0) r(sx + 2, y, 10, 1, '#3c6fd8'); else if (k === 1) { r(sx + 2, y, 6, 1, '#7ea6f6'); r(sx + 10, y, 7, 1, '#b9bdc8'); } else r(sx + 2, y, 14 - k * 2, 1, '#b9bdc8'); }
  } else if (act === 'test') {

    r(sx + 1, sy + 11, 18, 1, '#1f2a23'); r(sx + 1, sy + 11, 1 + Math.floor(t / 90) % 18, 1, '#4fd18b');
  } else if (act === 'data') {
    r(sx, sy, 20, 13, '#10131c'); r(sx + 2, sy + 11, 17, 1, '#555a6e'); r(sx + 2, sy + 1, 1, 11, '#555a6e');
    for (let i = 0; i < 6; i++) { const h = 3 + Math.round(3.5 * (1 + Math.sin(t / 700 + i * 1.3))); r(sx + 4 + i * 2 + i, sy + 11 - h, 2, h, i % 2 ? '#7ea6f6' : v[0]); }
  } else {
    const accent = (LANG[(a.langs || [])[0]] || [])[1];
    const cols = [accent || v[2], '#c3b6ff', '#8ad8ff', '#e8e4d8'];
    r(sx, sy, 20, 13, '#0f1f2a');
    const off = Math.floor(t / 160);
    for (let i = 0; i < 6; i++) {

      if (ind + w1 + w2 < 16) r(sx + 2 + ind + w1, sy + 1 + i * 2, w2, 1, cols[(hh >> 5) % cols.length]);
    }

  }
}

// tiny chiptune via WebAudio (square wave)
let actx = null;
function chime(notes, len = 0.09, type = 'square') {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * len;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.06, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + len * 1.6);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + len * 1.7);
    });
  } catch {}
}

  keys = keys.concat(k).slice(-KONAMI.length);
  if (keys.join() === KONAMI.join()) { FX.party = Date.now() + 15000; confetti(); chime([392, 523, 659, 784, 659, 784], 0.1); unlock('konami'); keys = []; }
  if (/^[a-z0-9]$/.test(k)) typed = (typed + k).slice(-20); else return;
  if (typed.endsWith('iddqd')) { FX.god = Date.now() + 20000; document.body.classList.add('god'); setTimeout(() => document.body.classList.remove('god'), 20000); chime([262, 330, 392, 523], 0.15, 'sawtooth'); unlock('god'); typed = ''; }
  if (typed.endsWith('matrix')) { matrixRain(); unlock('matrix'); typed = ''; }
  if (typed.endsWith('barrelroll')) { document.body.classList.remove('roll'); void document.body.offsetWidth; document.body.classList.add('roll'); chime([300, 450, 600, 900], 0.08, 'sawtooth'); unlock('barrel'); typed = ''; }
  if (typed.endsWith('42')) { FX.answer = Date.now() + 6000; chime([440, 440, 660], 0.1, 'triangle'); unlock('answer'); typed = ''; }
});
$('#logo').onclick = () => { if (burst('logo', 5, 2500)) { matrixRain(); unlock('matrix'); } };

/* full-screen effects canvas: confetti, matrix rain, time-travel fire trails */
const fx = $('#fx'), fctx = fx.getContext('2d');
let effects = [], fxRunning = false;
function fxSize() { const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fxSize); fxSize();
function runFx() {
  if (fxRunning) return; fxRunning = true;
  const loop = () => {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    const now = performance.now();
    effects = effects.filter(f => f(now) !== false);
    if (effects.length) requestAnimationFrame(loop); else { fxRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  requestAnimationFrame(loop);
}
function confetti() {
  if (REDUCE) return;
  const cols = ['#ff5d8f', '#f5c542', '#5dd6ff', '#8aff7a', '#e2805a', '#c3b6ff'], start = performance.now();
  const ps = Array.from({ length: 160 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 4 + Math.random() * 5, c: cols[Math.random() * cols.length | 0] }));
  effects.push(now => { const p = (now - start) / 3500; if (p > 1) return false;
    for (const q of ps) { q.vy += 0.35; q.vx *= 0.99; q.x += q.vx; q.y += q.vy; fctx.globalAlpha = 1 - p; fctx.fillStyle = q.c; fctx.fillRect(q.x, q.y, q.s, q.s); } fctx.globalAlpha = 1; });
  runFx();
}
function matrixRain() {
  if (REDUCE) { toast('🟩', 'Matrix', 'Despierta, Neo…', ''); return; }
  const start = performance.now(), size = 16, cols = Math.ceil(innerWidth / size), drops = Array.from({ length: cols }, () => Math.random() * -40);
  const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789'; const msg = 'Despierta, Neo…';
  effects.push(now => { const t = now - start; if (t > 7000) return false;
    const fade = t > 6000 ? 1 - (t - 6000) / 1000 : Math.min(1, t / 400);
    fctx.fillStyle = `rgba(0,0,0,${0.85 * fade})`; fctx.fillRect(0, 0, innerWidth, innerHeight);
    fctx.font = `${size}px monospace`;
    for (let i = 0; i < cols; i++) { const y = drops[i] * size; for (let k = 0; k < 14; k++) { fctx.fillStyle = k === 0 ? `rgba(220,255,220,${fade})` : `rgba(0,255,90,${fade * (1 - k / 14)})`; fctx.fillText(chars[(i * 7 + k + (t / 90 | 0)) % chars.length], i * size, y - k * size); } drops[i] += 0.45 + (i % 5) * 0.08; if (y > innerHeight + 240) drops[i] = Math.random() * -20; }
    const n = Math.min(msg.length, Math.floor(t / 140)); fctx.font = '700 34px "Pixelify Sans", monospace'; fctx.fillStyle = `rgba(200,255,200,${fade})`; fctx.textAlign = 'center'; fctx.fillText(msg.slice(0, n), innerWidth / 2, innerHeight / 2); fctx.textAlign = 'left'; });
  runFx();
}
function timeTravel() {
  if (REDUCE) return;
  const start = performance.now(), y1 = innerHeight * .78, y2 = y1 + 28;
  chime([220, 330, 440, 660, 880, 1320], 0.06, 'sawtooth');
  effects.push(now => { const t = now - start; if (t > 2600) return false;
    if (t < 160) { fctx.fillStyle = `rgba(255,255,255,${1 - t / 160})`; fctx.fillRect(0, 0, innerWidth, innerHeight); }
    const head = Math.min(1, t / 500) * innerWidth, fade = t > 1600 ? 1 - (t - 1600) / 1000 : 1;
    for (const y of [y1, y2]) for (let x = 0; x < head; x += 6) { const fl = Math.sin(x * .2 + t * .03) * 4; fctx.fillStyle = `rgba(255,${120 + (x * 7 % 120)},0,${fade * (0.5 + 0.5 * Math.random())})`; fctx.fillRect(x, y - 6 + fl * Math.random(), 6, 10 + Math.random() * 10); }
    fctx.font = '700 30px "Pixelify Sans", monospace'; fctx.fillStyle = `rgba(255,220,120,${fade})`; fctx.textAlign = 'center'; fctx.fillText('88 MPH', innerWidth / 2, y1 - 40); fctx.textAlign = 'left'; });
  runFx();
}

/* ======================= polling ======================= */
async function tick() {
  try {
    data = await (await fetch('/api/agents', { cache: 'no-store' })).json();
    render();
    const w = data.agents.filter(a => a.status === 'working').length, q = data.agents.filter(a => a.status === 'waiting' && a.kind === 'main').length;
    document.title = (q ? `(! ${q}) ` : w ? `(${w}) ` : '') + 'Oficina de Agentes';
  } catch { $('#stats').innerHTML = '<span class="chip"><span class="dot" style="--s:var(--waiting)"></span>Sin conexión con el servidor de la oficina…</span>'; }
}
async function tickUsage() { try { renderUsage(await (await fetch('/api/usage', { cache: 'no-store' })).json()); } catch {} }
async function loadTeam() {
  const results = await Promise.allSettled(['/api/config', '/api/workspace'].map(async url => (await fetch(url, { cache: 'no-store' })).json()));
  if (results[0].status === 'fulfilled') TEAM = results[0].value;
  if (results[1].status === 'fulfilled') officeWorkspace = results[1].value;
}

icons(); syncSecrets();
loadTeam().then(() => { tick(); tickUsage(); });
setInterval(tick, 2500); setInterval(tickUsage, 15000); setInterval(loadTeam, 30000);
requestAnimationFrame(frame);
